<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Focus Test</title>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const statusEl = document.getElementById('status');

      function onLoseFocus() {
        statusEl.textContent = 'You lost focus!';
      }

      // Listen for window blur
      window.addEventListener('blur', onLoseFocus);

      // Also use the Page Visibility API to catch tab switches
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          onLoseFocus();
        }
      });
    });
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #status {
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
<h1>Tab Focus Test</h1>
<p id="status">Switch tabs or windows to see the status change.</p>
</body>
</html>
